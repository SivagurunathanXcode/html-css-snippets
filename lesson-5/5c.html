<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fonts</title>
</head>
<style>
    p{
        font-family:Verdana;
    }

    .course-title{
        font-size:18px;
        font-weight:600;
        margin-bottom:0px;
    }

    .course-level{
        font-size:16px;
        color:grey;
        margin-top:6px;
        margin-bottom:24px;
    }

    .course-desc{
        width:350px;
    }

    .start-btn{
        margin-left:10px;
        height:35px;
        width:110px;
        background-color:rgb(48, 183, 48);
        border:none;
        border-radius:3px;
        font-size:14px;
        color:white;
        font-weight:550;
    }
</style>
<body>
    <p class="course-title">HTML CSS Course</p>
    <p class="course-level">Begginer to Pro</p>
    <p class="course-desc">In this course,we'll learn the skills you need to become a developer.</p>
    <button class="start-btn">Get Started</button>

</body>
</html>
