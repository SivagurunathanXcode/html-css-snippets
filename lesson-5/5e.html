<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fonts</title>
</head>
<style>
    p{
        font-family:Arial;
        margin:4px;
        text-align:center;
    }

    .update-tag{
        font-size:16px;
        font-weight:600;
        color:rgb(246, 161, 3);
        text-align:center;
    }

    .product{
        font-size:26px;
        font-weight:750;
        text-align:center;
    }
    
    .speciality{
        font-size:36px;
        font-weight:750;
        text-align:center;
    }

    .price{
        font-size:20px;
        text-align:center;
    }



    .buy-btn{
        text-align:center;  
        margin-top:12px; 
    }

    .buy-btn button{
        border:none;
        height:35px;
        width:90px;
        border-radius:22px;
        color:white;
        font-size:16px;
        font-weight:600;
        background-color:blue;
    }
</style>
<body>
    <p class="update-tag">New</p>
    <p class="product">MacBook Pro</p>
    <p class="speciality">Supercharged for Pros.</p>
    <p class="price">From &dollar;1999</p>
    <div class="buy-btn">
        <button>Buy</button>
    </div>
</body>
</html>
