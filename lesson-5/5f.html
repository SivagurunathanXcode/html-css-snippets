<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fonts</title>
</head>
<style>
    p{
        font-family:Arial;
        margin:6px;
    }

    .stock-value{
        font-size:28px;
        font-weight:500;
    }

    .stock-value span{
        font-size:16px;
        font-weight: normal;
        color:grey;
    }
    
    .stock-today{
        font-size:16px;
        color:green;
    }

    .stock-change{
        font-size:16px;
        color:rgb(78, 76, 76);
    }

    .stock-change span{
        color:red;
    }
</style>
<body>
    <p class="stock-value">
        1,049.61 <span>USD</span>
    </p>

    <p class="stock-today">+18.05(1.75%)today</p>
    <p class="stock-change"> After hours 1,048.00 <span>-1.61(0.15%)</span></p>

</body>
</html>
