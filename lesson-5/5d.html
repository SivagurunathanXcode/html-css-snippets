<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fonts</title>
</head>
<style>
    p{
        font-family:Arial;
    }

    .ad-hook{
        font-size:26px;
        font-weight:700;
        text-align:center;
    }

    .ad-info{
        font-size:16px;
        text-align:center;
    }

    .ad-anchor{
        font-size:18px;
        display:block;
        text-align:center;
        text-decoration:none;
    }
</style>
<body>
    <p class="ad-hook">Shopping for your Business?</p>
    <p class="ad-info">See how Apple at Work can help.</p>
    <a class="ad-anchor" href="#">Learn &gt;</a>
</body>
</html>
