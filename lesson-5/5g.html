<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fonts</title>
</head>
<style>

    div{
        width:500px;
    }

    p{
        font-family:Arial;
        font-size:16px;
        margin:6px;
    }

    .username{
        font-size:18px;
        font-weight:700;
    }

    .username span{
        color:grey;
        font-weight:normal;

    }

    .tweet{
        font-weight:500;
        margin-bottom:16px;
    }

    .link{
        font-weight:500;
    }

    .link span{
        color:rgb(12, 95, 228);
        font-weight:normal;
    }


</style>
<body>
    <div> 
        <p class="username">freeCodeCamp.org <span>@freeCodeCamp 1h</span></p>
        <p class="tweet">As a web developer, I love learning new technologies and sharing my knowledge with others.</p>
        <p class="link">Here <span class="username">@chp_it</span> outlines the top skills new developers should have. </p>
    </div>
   

</body>
</html>
