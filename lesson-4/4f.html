<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        .subs-btn{
            background-color:rgb(204, 0, 0);
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:3px;
            font-size:14px;
            cursor:pointer;
        }

        .subs-btn:hover{
            opacity:0.7;
            transition:0.3s;
        }

        .join-btn{
            color:rgb(6, 95, 212);
            border-color:rgb(6, 95, 212);
            border-style:solid;
            padding:9.5px 20px;
            border-width:1px;
            margin-left:10px;
            margin-right:10px;

        }

        .join-btn:hover{
            background-color:rgb(6, 95, 212);
            color:white;
            transition:0.3s;
        }

        .tweet-btn{
            background-color:rgb(29, 155, 240);
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:20px;
            font-weight:bold;
            font-size:14px;
        }

        .tweet-btn:hover{
            box-shadow: 0px 5px 8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
   <button class="subs-btn">SUBSCRIBE</button>
   <button class="join-btn">JOIN</button>
   <button class="tweet-btn">Tweet</button>
</body>
</html>
