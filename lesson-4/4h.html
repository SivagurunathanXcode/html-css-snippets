<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stretch</title>
    <style>
        .stretch{
            background-color:green;
            color:white;
            padding:10px 30px;
            font-size:16px;
            border:none;
            cursor:pointer;
            transition:padding 0.3s ease-in-out;
        }

        .stretch:hover{
            padding:20px 50px;
        }
    </style>
</head>
<body>
    <button class="stretch">Stretch</button>
</body>
</html>
