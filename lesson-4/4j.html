<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .btn{
            background-color:green;
            color:white;
            padding:10px 20px;
            font-size:14px;
            border:none;
            margin-left:10px;
            margin-right:10px;
            cursor:pointer;
            transition:0.4s;
        }

        .btn:hover{
            padding-left:30px;
            padding-right:30px;
            margin-left:0px;
            margin-right:0px;
        }
    </style>
</head>
<body>
    <button class="btn">One</button>
    <button class="btn">Two</button>
    <button class="btn">Three</button>
</body>
</html>
