<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .shadow{
            background-color:green;
            color:white;
            padding:10px 20px;
            border:none;
            box-shadow: 10px 10px 8px rgba(0, 0, 0, 0.15);
            transition:0.5s ease-in-out;
        }

        .shadow:active{
                box-shadow:none;
                margin-top:3px;
                margin-left:3px;
        }
    </style>
</head>
<body>
    <button class="shadow">Shadow</button>
</body>
</html>
